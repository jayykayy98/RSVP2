<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aida & Firdaus - Wedding Invitation</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #fff0f5;
      color: #333;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #ffccd5;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav a {
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 80px 20px;
      text-align: center;
    }
    .hero {
      background: url('wedding-bg.jpg') no-repeat center/cover;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .countdown {
      font-size: 2rem;
      margin-top: 20px;
    }
    .form-group {
      margin: 10px 0;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #ff7f7f;
      color: white;
      border: none;
      cursor: pointer;
    }
    footer {
      padding: 20px;
      background: #ffccd5;
      text-align: center;
    }
  </style>
</head>
<body>

<nav>
  <a href="#home">Home</a>
  <a href="#rsvp">RSVP</a>
  <a href="#wishes">Ucapan</a>
  <a href="#contact">Hubungi</a>
</nav>

<section id="home" class="hero">
  <h1>Aida & Firdaus</h1>
  <p>Jemputan Majlis Perkahwinan</p>
  <div class="countdown" id="countdown">Loading...</div>
</section>

<section id="rsvp">
  <h2>RSVP</h2>
  <form id="rsvpForm">
    <div class="form-group">
      <label>Nama</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Hadir?</label>
      <select name="attendance" required>
        <option value="">Pilih</option>
        <option value="Ya">Ya</option>
        <option value="Tidak">Tidak</option>
      </select>
    </div>
    <div class="form-group">
      <label>Bilangan Kehadiran</label>
      <input type="number" name="guests" min="1">
    </div>
    <button type="submit">Hantar RSVP</button>
  </form>
</section>

<section id="wishes">
  <h2>Ucapan untuk Pengantin</h2>
  <form id="wishesForm">
    <div class="form-group">
      <label>Nama</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Ucapan</label>
      <textarea name="message" rows="4" required></textarea>
    </div>
    <button type="submit">Hantar Ucapan</button>
  </form>
  <div id="wishesList"></div>
</section>

<section id="contact">
  <h2>Hubungi Kami</h2>
  <p>Boleh hubungi pihak keluarga untuk sebarang pertanyaan.</p>
  <p>📞 Aida: 012-3456789</p>
  <p>📞 Firdaus: 019-8765432</p>
</section>

<footer>
  <p>&copy; 2025 Aida & Firdaus</p>
</footer>

<script>
  // Countdown Timer
  const countdown = document.getElementById('countdown');
  const weddingDate = new Date('2025-12-20T10:00:00');
  function updateCountdown() {
    const now = new Date();
    const diff = weddingDate - now;

    if (diff <= 0) {
      countdown.textContent = 'Majlis sedang berlangsung!';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    countdown.textContent = `${days} Hari ${hours} Jam ${minutes} Minit ${seconds} Saat`;
  }
  const timer = setInterval(updateCountdown, 1000);
  updateCountdown();

  // RSVP Form
  document.getElementById('rsvpForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = this.name.value;
    const attendance = this.attendance.value;
    const guests = this.guests.value || 1;
    alert(`Terima kasih, ${name}! Kehadiran: ${attendance}, Bilangan tetamu: ${guests}`);
    this.reset();
  });

  // Wishes Form
  document.getElementById('wishesForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = this.name.value;
    const message = this.message.value;

    const wishesList = document.getElementById('wishesList');
    const wish = document.createElement('p');
    wish.textContent = `${name}: "${message}"`;
    wishesList.prepend(wish);

    this.reset();
  });
</script>

</body>
</html>
